<!DOCTYPE html>
<html>
<body>
<h2>Read the Scripture to Stop Alarm</h2>
<h3 id="challengeTitle"></h3>
<p id="challengeText"></p>

<button onclick="startRecording()">Start Recording</button>
<button onclick="stopRecording()">Stop Recording</button>

<p>Live Transcript: <span id="live"></span></p>

<script>
function wordSimilarity(recResult, challengeText) {
  const recWords = recResult.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0);
  const challengeWords = challengeText
      .toLowerCase()
      .replace(/[^a-zA-Z\s']/g, '')
      .trim()
      .split(/\s+/)
      .filter(w => w.length > 0);

  const matches = recWords.filter(word => challengeWords.includes(word));
  return challengeWords.length === 0 ? 0 : matches.length / challengeWords.length;
}

let fullTranscript = "";
let recognition = null;
let shouldContinue = false;

function createRecognition() {
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-US";

  rec.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        fullTranscript += transcript + " ";
      } else {
        interim += transcript;
      }
    }
    document.getElementById("live").innerHTML = fullTranscript + '<span style="color:#888;">' + interim + '</span>';
  };

  rec.onerror = (event) => {
    console.log("Speech error:", event.error);
    if (event.error !== "aborted" && shouldContinue) {
      setTimeout(startRecognition, 100);
    }
  };

  rec.onend = () => {
    if (shouldContinue) {
      startRecognition();
    }
  };

  return rec;
}

function startRecognition() {
  if (recognition) recognition.abort();
  recognition = createRecognition();
  recognition.start();
}

function startRecording() {
  fullTranscript = "";
  document.getElementById("live").innerHTML = "";
  shouldContinue = true;
  startRecognition();
}

function stopRecording() {
  shouldContinue = false;
  if (recognition) {
    recognition.stop();
  }
  setTimeout(checkTranscript, 800);
}

function checkTranscript() {
  fullTranscript = fullTranscript.trim();
  const challengeText = document.getElementById("challengeText").innerText;
  const similarity = wordSimilarity(fullTranscript, challengeText);

  console.log("Full transcript:", fullTranscript);
  console.log("Similarity:", similarity);

  if (similarity > 0.4 || Math.abs(challengeText.length - fullTranscript.length) < 25) {
    fetch("/stop", { method: "POST" });
    alert("Alarm Stopped!");
  } else {
    alert("Not close enough. Keep trying!");
  }
}

async function fetchChallenge() {
  const response = await fetch("/challenge");
  const data = await response.json();
  const challenge = JSON.parse(data.challenge);
  document.getElementById("challengeTitle").innerText = challenge.reference;
  document.getElementById("challengeText").innerText = challenge.text;
}

function snoozeAlarm() {
  fetch("/snooze", { method: "POST" });
}

fetchChallenge();
snoozeAlarm();
</script>
</body>
</html>
